# "big" CPU type for heterogeneous cluster studies: wide pipeline, large
# structures and caches. Referenced by cpu_types.big.core_config. The `top.coreN`
# root is stripped by ClusterSim; every param below applies to each big core.
# Widths, ROB, registers, branch checkpoints, LSQ and L1 sizes follow BOOM GigaBoomConfig
# (riscv-boom config-mixins.scala); issue queue, buffers, L2 and latencies do not.

top.core0:
  params:
    ooo_enabled: true
    wrong_path_enabled: true
    bypass_queues: false
    visualizer_enabled: false
  fetch:
    params:
      fetch_width: 16
      fetch_buffer_capacity: 64
  icache:
    params:
      cache_mode: structural
      prefetcher_type: next_line       # as the single-core config.yaml
      prefetch_degree: 2
      hit_latency: 2
      miss_latency: 10
      mshr_capacity: 4
      cache_size_kb: 32
      cache_line_size: 64
      cache_associativity: 8
      replacement_policy: lru
  fetch_queue:
    params:
      capacity: 40
  decode:
    params:
      decode_width: 5
  decode_queue:
    params:
      capacity: 64
  rename:
    params:
      dispatch_width: 5
      num_phys_regs: 128
      max_branch_checkpoints: 20
  issue:
    params:
      mode: unified
      issue_queue_capacity: 36
      issue_width: 9
      num_phys_regs: 128
      issue_ports: [ALU+Branch+Fence, ALU+Branch, ALU+Mul+Div, ALU, ALU, Load, Load+Store, FpOp+VecOp, FpOp+VecOp]
  execute:
    params:
      granularity: unified
      write_port_mode: unified
      write_port_count: 9
      unified_max_in_flight: 64
  lsq:
    params:
      load_queue_capacity: 32
      store_queue_capacity: 32
  dcache:
    params:
      cache_mode: structural
      prefetcher_type: ip_stride       # as the single-core config.yaml
      prefetch_degree: 2
      prefetch_distance: 4
      hit_latency: 3
      miss_latency: 10
      mshr_capacity: 8
      cache_size_kb: 32
      cache_line_size: 64
      cache_associativity: 8
      replacement_policy: lru
      store_buffer_capacity: 8
      write_policy: write_back
  writeback:
    params:
      retire_width: 5
      rob_capacity: 130
  l2cache:
    params:
      enabled: true                    # big cores keep a private L2 -> cluster cache acts as L3
      prefetcher_type: stream          # as the single-core config.yaml
      cache_size_kb: 256               # big core's private L2 (sized larger than little's)
      cache_line_size: 64
      cache_associativity: 8
      hit_latency: 10
      mshr_capacity: 16
      queue_capacity: 64
