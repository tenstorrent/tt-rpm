# Sparta-native parameter config for the core CPU model.
# Paths match the tree structure: top.core0.<unit>.params.<param>
# Auto-applied by CommandLineSimulator via -c flag.

top.core0:
  params:
    ooo_enabled: true
    # Wrong-path speculation configuration
    wrong_path_enabled: true           # Master switch for speculative execution on mispredicted paths
    wrong_path_max_depth: 8            # Max nested speculation levels
    bypass_queues: false               # Bypass FetchQueue/DecodeQueue (simpler bring-up for wrong-path)
    visualizer_enabled: false
    visualizer_max_instructions: 20000
    visualizer_format: table
    visualizer_output_file: pipeline.txt
    visualizer_color: false
    visualizer_debug_enabled: false        # Enable per-cycle debug output (helpful for deadlock debugging)
    visualizer_debug_file: pipeline_debug.txt  # Debug output file
    visualizer_debug_start_cycle: 0        # First cycle to output (0 = start from beginning)
    visualizer_debug_end_cycle: 0          # Last cycle to output (0 = unlimited)
    cache_viewer_enabled: false
    cache_viewer_format: log
    cache_viewer_output_file: stderr
  fetch:
    params:
      initial_pc: 2147483648
      fetch_width: 16
      fetch_buffer_capacity: 64
      max_branches_per_fetch: 2
  icache:
    params:
      cache_mode: structural
      prefetcher_type: next_line       # instruction prefetcher ('none' = disabled)
      prefetch_degree: 2
      hit_rate: 0.9                    # (probabilistic mode only)
      hit_latency: 2                   # pipelined: one fetch per cycle
      miss_latency: 10
      mshr_capacity: 4
      cache_size_kb: 32                # (structural mode)
      cache_line_size: 64              # (structural mode)
      cache_associativity: 8           # (structural mode)
      replacement_policy: lru          # (structural mode)
      rng_seed: 0xCAFE                 # (probabilistic mode only)
  fetch_queue:
    params:
      capacity: 32
      latency: 1                       # predecode/align stage
  decode:
    params:
      decode_width: 4
      lat_alu: 1
      lat_mul: 3
      lat_div: 14                      # uops.info: 64-bit DIV on Ice Lake and Alder Lake-P, quotient latency 14
      lat_branch: 1
      lat_load: 1
      lat_store: 1
      lat_fp: 4
      lat_fp_add: 3                    # ADDSS on Zen 2-4, 3
      lat_fp_mul: 4                    # MULSS on Ice Lake, 4
      lat_fp_fma: 4                    # VFMADD231SS on Ice Lake and Zen 3/4, 4
      lat_fp_cvt: 4                    # CVTSS2SD and CVTSI2SS on Ice Lake, 4
      lat_fp_cmp: 2                    # MINSS and CMPSS on Zen 4, 2; rocket-chip FPUParams.fpmuLatency 2
      lat_fp_move: 2                   # rocket-chip FPUParams.fpmuLatency and ifpuLatency, 2
      lat_fp_div_s: 10                 # DIVSS on Zen 2/3, 10
      lat_fp_div_d: 13                 # DIVSD on Ice Lake, Alder Lake-P and Zen 2-4, 13
      lat_vec: 4
      lat_fence: 1
  decode_queue:
    params:
      capacity: 32
      latency: 1                       # second rename stage
  branch_predictor:
    params:
      predictor_type: tage_sc_l_64kb   # or tage_sc_l_8kb, gshare, bimodal, or probabilistic (accuracy oracle)
      btb_type: setassoc               # 'none' = oracle targets
      btb_entries: 2048
      btb_ways: 2
      ras_type: circular               # 'none' = oracle return targets
      ras_entries: 32
      taken_redirect_latency: 2        # BTB/TAGE redirect in the 2nd fetch stage: 1-cycle bubble per taken branch
  rename:
    params:
      dispatch_width: 4
      num_phys_regs: 128
      freelist_headroom: 8
      regfile_banking_enabled: false
      regfile_num_banks: 4
      regfile_reads_per_bank: 2
      max_branch_checkpoints: 20       # Max in-flight branch checkpoints for misprediction recovery
  issue:
    params:
      mode: unified
      selection: age_matrix
      issue_queue_capacity: 36
      issue_width: 9
      issue_ports: [ALU+Branch+Fence, ALU+Branch, ALU+Mul+Div, ALU, Load, Load, Store, FpOp+VecOp, FpOp+VecOp]
      regfile_read_latency: 1
      int_div_units: 1
      fp_div_units: 1
      int_div_interval: 10             # uops.info: 64-bit DIV on Ice Lake, reciprocal throughput 10
      fp_div_s_interval: 3             # DIVSS, 3
      fp_div_d_interval: 4             # DIVSD, 4
      num_phys_regs: 128
  execute:
    params:
      granularity: unified             # issue ports and dividers set throughput; this is only an in-flight cap
      unified_max_in_flight: 64
      write_port_mode: unified
      write_port_count: 8              # one result bus per issue port that writes a register
      writeback_buffer_enabled: false
      writeback_buffer_capacity: 16
      writeback_buffer_drain_width: 4
      writeback_buffer_latency: 1
  lsq:
    params:
      load_queue_capacity: 32
      store_queue_capacity: 32
      store_forwarding: true
      forwarding_latency: 1
      load_ports: 2                    # loads per cycle into the D-cache
      store_ports: 1                   # retired stores per cycle into the store buffer
      mem_dep_predictor: store_sets    # store_sets | blind | none
      ssit_entries: 4096
      lfst_entries: 128
      ssit_clear_interval: 1000000
      num_banks: 1
  dcache:
    params:
      cache_mode: structural
      prefetcher_type: ip_stride       # data prefetcher ('none' = disabled)
      prefetch_degree: 2
      prefetch_distance: 4
      hit_rate: 1.0                    # (probabilistic mode only)
      hit_latency: 3                   # 4-cycle load-to-use with the AGU
      miss_latency: 10
      mshr_capacity: 8
      cache_size_kb: 32                # (structural mode)
      cache_line_size: 64              # (structural mode)
      cache_associativity: 8           # (structural mode)
      replacement_policy: lru          # (structural mode)
      store_buffer_capacity: 8         # Store buffer entries
      write_policy: write_back
      num_banks: 1                     # Number of banks
      reads_per_bank_per_cycle: 1      # Read ports per bank
      writes_per_bank_per_cycle: 1     # Write ports per bank
      fill_occupies_write_port: false  # Fills use write port
      rng_seed: 0xDEAD                 # (probabilistic mode only)
  mmu:
    params:
      enabled: true                    # TLB + page-walk timing (false = free translation)
      itlb_entries: 32                 # fully associative
      itlb_ways: 32
      dtlb_entries: 32                 # fully associative
      dtlb_ways: 32
      l2tlb_entries: 1024
      l2tlb_ways: 8
      l2tlb_latency: 8
      num_walkers: 2
      pwc_entries: 16                  # page-walk cache entries per non-leaf level
  writeback:
    params:
      retire_width: 4
      rob_capacity: 128
  l2cache:
    params:
      enabled: true
      cache_size_kb: 1024
      cache_associativity: 16
      hit_latency: 4                   # array latency; 15-cycle load-to-use with the L1 and transfers
      mshr_capacity: 32
      queue_capacity: 16               # per source; must cover each L1's mshr_capacity
      victim_buffer_capacity: 16
      prefetcher_type: stream          # static distance 16, degree 2 (Srinath et al. middle-of-the-road)
  dram:
    params:
      enabled: true                    # false: flat l2cache.miss_latency
      data_rate_mts: 3200              # DDR4-3200AA (22-22-22), JESD79-4
      channels: 2
      ranks: 1
      static_latency_ns: 40            # controller + interconnect + LLC miss
