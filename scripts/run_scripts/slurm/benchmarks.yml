# Benchmark registry for the RPM Slurm runner.
#
# Each top-level key is a benchmark name referenced by run.py --benchmarks.
# An entry simply names a directory of ELF workloads, behaving like --elf-dir
# but under a reusable name.
#
# Fields:
#   type:  'elf'  -> passed to the model as --target-elf  (execution-driven)
#   path:  absolute or RPM-root-relative directory containing workload files
#   glob:  filename pattern to discover workload files inside `path`
#
# Point `path` at your own workload directories and add as many entries as you
# need.

microbench:
  type: elf
  path: tests/build
  glob: "*.elf"
